<header class="site-header">
  <a class="brand" href="/">Touer Mohamed Elamine</a>
  <nav aria-label="Main">
    {{ $cur := . }}
    {{ range site.Menus.main }}
      <a href="{{ .URL }}"{{ if or ($cur.RelPermalink | hasPrefix .URL) }} aria-current="page"{{ end }}>{{ .Name }}</a>
    {{ end }}
    <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Switch between light and dark theme">Light</button>
  </nav>
</header>
